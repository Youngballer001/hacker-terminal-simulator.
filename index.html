<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A browser-based hacker-style terminal simulator built with HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#050807">
  <title>Dennoh Terminal | System Console</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="terminal-shell">
    <header class="terminal-header">
      <div class="window-controls" aria-hidden="true">
        <span class="control close"></span>
        <span class="control minimize"></span>
        <span class="control maximize"></span>
      </div>
      <p class="window-title">DENNOH TERMINAL <span>— SYSTEM CONSOLE</span></p>
      <button class="header-button" id="clear-button" type="button" title="Clear terminal">CLEAR</button>
    </header>

    <section class="terminal-screen" aria-label="Terminal output">
      <div class="boot-screen" id="boot-screen" aria-live="polite">
        <p>DENNOH SYSTEMS <span class="muted">[Version 1.0.0]</span></p>
        <p>(c) 2026 Dennoh Systems. All rights reserved.</p>
        <div class="boot-lines" id="boot-lines"></div>
      </div>
      <div class="terminal-output" id="terminal-output" aria-live="polite"></div>
      <div class="input-line">
        <label class="prompt" for="command-input">DENNOH@SYSTEM:~$</label>
        <input id="command-input" type="text" autocomplete="off" autocapitalize="off"
          spellcheck="false" aria-label="Enter a terminal command" disabled>
        <span class="cursor" aria-hidden="true"></span>
      </div>
      <p class="terminal-hint">Type <kbd>help</kbd> to see available commands. Use ↑ / ↓ to browse command history.</p>
    </section>

    <footer class="terminal-footer">
      <span><i class="status-dot"></i> SYSTEM ONLINE</span>
      <span>LOCAL SIMULATION <b>•</b> NO REAL NETWORK ACCESS</span>
      <span id="clock">--:--:--</span>
    </footer>
  </main>
</body>
</html>
